AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  IAM roles migrated from SAML federation to AAM trust policy.
  Generated by generate_iac_templates.py

Parameters:
  TrustServicePrincipal:
    Type: String
    Default: account-access-preview.amazonaws.com
    Description: The service principal for the new trust relationship.

Resources:

  EntraAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Entra_Admin
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AAMTrustPolicyStatement
            Effect: Allow
            Principal:
              Service: !Ref TrustServicePrincipal
            Action:
              - sts:AssumeRole
              - sts:SetContext
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: ManagedBy
          Value: AAM-Migration

  EntraSecurityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Entra_Security
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AAMTrustPolicyStatement
            Effect: Allow
            Principal:
              Service: !Ref TrustServicePrincipal
            Action:
              - sts:AssumeRole
              - sts:SetContext
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
      Tags:
        - Key: ManagedBy
          Value: AAM-Migration

  ExtraReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Extra_ReadOnly
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AAMTrustPolicyStatement
            Effect: Allow
            Principal:
              Service: !Ref TrustServicePrincipal
            Action:
              - sts:AssumeRole
              - sts:SetContext
      Tags:
        - Key: ManagedBy
          Value: AAM-Migration

Outputs:
  EntraAdminRoleArn:
    Description: ARN of Entra_Admin
    Value: !GetAtt EntraAdminRole.Arn
  EntraSecurityRoleArn:
    Description: ARN of Entra_Security
    Value: !GetAtt EntraSecurityRole.Arn
  ExtraReadOnlyRoleArn:
    Description: ARN of Extra_ReadOnly
    Value: !GetAtt ExtraReadOnlyRole.Arn
