AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Truffle cross-account role — deployed via StackSet to all target accounts.
  Grants the Truffle managed backend read access for scanning/discovery and
  limited write access (iam:UpdateAssumeRolePolicy) for trust policy migration.

Parameters:
  TruffleAccountId:
    Type: String
    Description: AWS account ID hosting the Truffle managed backend
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID

  ExternalId:
    Type: String
    Description: Shared external ID for confused-deputy protection (provided during onboarding)
    NoEcho: true
    MinLength: 8

Resources:
  TruffleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TruffleRole
      Description: >
        Allows the Truffle managed backend to scan resource policies and
        update IAM trust policies during AAM migration.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TruffleAccountId}:role/TruffleLambdaExecRole"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: TruffleMigratePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowTrustPolicyMigration
                Effect: Allow
                Action:
                  - iam:UpdateAssumeRolePolicy
                Resource: "*"
        - PolicyName: TruffleIdcReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowIdcDiscovery
                Effect: Allow
                Action:
                  - sso:ListInstances
                  - sso:DescribeInstance
                  - sso-admin:ListPermissionSets
                  - sso-admin:DescribePermissionSet
                  - sso-admin:ListPermissionSetsProvisionedToAccount
                  - sso-admin:ListAccountsForProvisionedPermissionSet
                  - sso-admin:ListAccountAssignments
                  - sso-admin:GetInlinePolicyForPermissionSet
                  - sso-admin:ListManagedPoliciesInPermissionSet
                  - sso-admin:ListCustomerManagedPolicyReferencesInPermissionSet
                  - identitystore:DescribeUser
                  - identitystore:DescribeGroup
                  - identitystore:ListUsers
                  - identitystore:ListGroups
                Resource: "*"
        - PolicyName: TruffleRoleCreationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowRoleCreation
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:GetRole
                Resource: "arn:aws:iam::*:role/aam/*"
              - Sid: AllowAAMEntitlements
                Effect: Allow
                Action:
                  - account-access-preview:CreateEntitlement
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: Truffle
        - Key: Purpose
          Value: AAM-Migration-CrossAccount-Access

Outputs:
  RoleArn:
    Description: ARN of the TruffleRole deployed in this account
    Value: !GetAtt TruffleRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TruffleRoleArn"

  RoleName:
    Description: Name of the deployed role
    Value: !Ref TruffleRole
