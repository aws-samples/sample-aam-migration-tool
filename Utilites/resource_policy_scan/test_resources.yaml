AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates test resources with resource policies referencing an Identity Center role.
  Used to validate the scan_resource_policies.py scanner.

Parameters:
  IdentityCenterRoleArn:
    Type: String
    Default: "arn:aws:iam::075384444871:role/aws-reserved/sso.amazonaws.com/us-east-1/AWSReservedSSO_AdministratorAccess_abc123def456"
    Description: Full ARN of the Identity Center role to reference in resource policies

Resources:

  # ─── S3 ──────────────────────────────────────────────────────────────────
  TestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "policy-scan-test-${AWS::AccountId}"

  TestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TestBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: s3:GetObject
            Resource: !Sub "${TestBucket.Arn}/*"

  # ─── SQS ─────────────────────────────────────────────────────────────────
  TestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: policy-scan-test-queue

  TestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TestQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: sqs:ReceiveMessage
            Resource: !GetAtt TestQueue.Arn


  # ─── SNS ─────────────────────────────────────────────────────────────────
  TestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: policy-scan-test-topic

  TestTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref TestTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: sns:Subscribe
            Resource: !Ref TestTopic

  # ─── KMS ─────────────────────────────────────────────────────────────────
  TestKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Policy scan test key
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: kms:DescribeKey
            Resource: "*"

  # ─── Secrets Manager ────────────────────────────────────────────────────
  TestSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: policy-scan-test-secret
      SecretString: '{"test":"value"}'

  TestSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref TestSecret
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: secretsmanager:GetSecretValue
            Resource: !Ref TestSecret

  # ─── ECR ─────────────────────────────────────────────────────────────────
  TestEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: policy-scan-test-repo
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: ecr:BatchGetImage
            Resource: "*"

  # ─── EFS ─────────────────────────────────────────────────────────────────
  TestEfs:
    Type: AWS::EFS::FileSystem
    Properties:
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: elasticfilesystem:DescribeMountTargets
            Resource: "*"


  # ─── OpenSearch ──────────────────────────────────────────────────────────
  TestOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: policy-scan-test
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: es:DescribeDomain
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/policy-scan-test/*"

  # ─── Backup Vault ────────────────────────────────────────────────────────
  TestBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: policy-scan-test-vault
      AccessPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: backup:DescribeBackupVault
            Resource: "*"

  # ─── EventBridge ─────────────────────────────────────────────────────────
  TestEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: policy-scan-test-bus

  TestEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref TestEventBus
      StatementId: AllowIdentityCenterRole
      Statement:
        Sid: AllowIdentityCenterRole
        Effect: Allow
        Principal:
          AWS: !Ref IdentityCenterRoleArn
        Action: events:DescribeEventBus
        Resource: !GetAtt TestEventBus.Arn

  # ─── CloudWatch Logs ─────────────────────────────────────────────────────
  TestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /policy-scan-test
      RetentionInDays: 1

  TestLogsResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: policy-scan-test-logs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowIdentityCenterRole",
              "Effect": "Allow",
              "Principal": {
                "AWS": "${IdentityCenterRoleArn}"
              },
              "Action": "logs:DescribeLogGroups",
              "Resource": "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
            }
          ]
        }

  # ─── Glue ────────────────────────────────────────────────────────────────
  TestGlueResourcePolicy:
    Type: AWS::Glue::ResourcePolicy
    Properties:
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: glue:GetDatabase
            Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"

  # ─── IAM Role (trust policy) ────────────────────────────────────────────
  TestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: policy-scan-test-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: !Ref IdentityCenterRoleArn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # ─── Lambda ──────────────────────────────────────────────────────────────
  TestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: policy-scan-test-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  TestLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: policy-scan-test-function
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TestLambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200}

  TestLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TestLambdaFunction
      Action: lambda:GetFunction
      Principal: !Ref IdentityCenterRoleArn

Outputs:
  BucketName:
    Value: !Ref TestBucket
  QueueUrl:
    Value: !Ref TestQueue
  TopicArn:
    Value: !Ref TestTopic
  KmsKeyId:
    Value: !Ref TestKmsKey
  SecretArn:
    Value: !Ref TestSecret
  OpenSearchDomainArn:
    Value: !GetAtt TestOpenSearchDomain.Arn
  LambdaFunctionArn:
    Value: !GetAtt TestLambdaFunction.Arn
