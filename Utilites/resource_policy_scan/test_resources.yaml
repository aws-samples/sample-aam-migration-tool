AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates test resources with resource policies referencing an Identity Center role.
  Used to validate the scan_resource_policies.py scanner.

Parameters:
  IdentityCenterRoleArn:
    Type: String
    Default: "arn:aws:iam::183068582925:role/aws-reserved/sso.amazonaws.com/us-west-2/AWSReservedSSO_AWSAdministratorAccess_6516ec63d4add68b"
    Description: Full ARN of the Identity Center role to reference in resource policies

Resources:

  # ─── VPC (private only, for OpenSearch) ──────────────────────────────────
  TestVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.255.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: policy-scan-test-vpc

  TestPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TestVpc
      CidrBlock: 10.255.0.0/25
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: policy-scan-test-private

  TestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Policy scan test - OpenSearch
      VpcId: !Ref TestVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.255.0.0/24

  # ─── S3 ──────────────────────────────────────────────────────────────────
  TestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "policy-scan-test-${AWS::AccountId}"

  TestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TestBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: s3:GetObject
            Resource: !Sub "${TestBucket.Arn}/*"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── SQS ─────────────────────────────────────────────────────────────────
  TestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: policy-scan-test-queue

  TestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TestQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: sqs:ReceiveMessage
            Resource: !GetAtt TestQueue.Arn
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn


  # ─── SNS ─────────────────────────────────────────────────────────────────
  TestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: policy-scan-test-topic

  TestTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref TestTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: sns:Subscribe
            Resource: !Ref TestTopic
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── KMS ─────────────────────────────────────────────────────────────────
  TestKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Policy scan test key
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: kms:DescribeKey
            Resource: "*"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── Secrets Manager ────────────────────────────────────────────────────
  TestSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: policy-scan-test-secret
      SecretString: '{"test":"value"}'

  TestSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref TestSecret
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: secretsmanager:GetSecretValue
            Resource: !Ref TestSecret
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── ECR ─────────────────────────────────────────────────────────────────
  TestEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: policy-scan-test-repo
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: ecr:BatchGetImage
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── EFS ─────────────────────────────────────────────────────────────────
  TestEfs:
    Type: AWS::EFS::FileSystem
    Properties:
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: elasticfilesystem:DescribeMountTargets
            Resource: "*"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn


  # ─── OpenSearch ──────────────────────────────────────────────────────────
  TestOpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
        VolumeType: gp3
      VPCOptions:
        SubnetIds:
          - !Ref TestPrivateSubnet
        SecurityGroupIds:
          - !Ref TestSecurityGroup
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: es:DescribeDomain
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── OpenSearch Serverless ───────────────────────────────────────────────
  TestAossEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: policy-scan-test-enc
      Type: encryption
      Policy: >-
        {"Rules":[{"ResourceType":"collection","Resource":["collection/policy-scan-test"]}],"AWSOwnedKey":true}

  TestAossNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: policy-scan-test-net
      Type: network
      Policy: >-
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/policy-scan-test"]}],"AllowFromPublic":true}]

  TestAossCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - TestAossEncryptionPolicy
      - TestAossNetworkPolicy
    Properties:
      Name: policy-scan-test
      Type: TIMESERIES

  TestAossAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: policy-scan-test-access
      Type: data
      Policy: !Sub >-
        [{"Rules":[{"ResourceType":"index","Resource":["index/policy-scan-test/*"],"Permission":["aoss:ReadDocument"]}],"Principal":["${IdentityCenterRoleArn}"]}]

  # ─── Backup Vault ────────────────────────────────────────────────────────
  TestBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: policy-scan-test-vault
      AccessPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: backup:DescribeBackupVault
            Resource: "*"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── EventBridge ─────────────────────────────────────────────────────────
  TestEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: policy-scan-test-bus

  TestEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref TestEventBus
      StatementId: AllowIdentityCenterRole
      Statement:
        Sid: AllowIdentityCenterRole
        Effect: Allow
        Principal:
          AWS: "*"
        Action: events:DescribeEventBus
        Resource: !GetAtt TestEventBus.Arn
        Condition:
          ArnEquals:
            "aws:PrincipalArn": !Ref IdentityCenterRoleArn

  # ─── CloudWatch Logs ─────────────────────────────────────────────────────
  TestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /policy-scan-test
      RetentionInDays: 1

  TestLogsResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: policy-scan-test-logs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowIdentityCenterRole",
              "Effect": "Allow",
              "Principal": {
                "AWS": "*"
              },
              "Action": "logs:DescribeLogGroups",
              "Resource": "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*",
              "Condition": {
                "ArnEquals": {
                  "aws:PrincipalArn": "${IdentityCenterRoleArn}"
                }
              }
            }
          ]
        }


  # ─── IAM Role (trust policy) ────────────────────────────────────────────
  # IAM trust policies validate principals, so use Condition instead
  TestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: policy-scan-test-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowIdentityCenterRole
            Effect: Allow
            Principal:
              AWS: "*"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Ref IdentityCenterRoleArn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # ─── Lambda ──────────────────────────────────────────────────────────────
  TestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: policy-scan-test-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  TestLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: policy-scan-test-function
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TestLambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200}

  # Lambda::Permission doesn't support Condition, but it also doesn't validate
  # the principal ARN — it accepts any account ID as the principal.
  # We use the account ID from the role ARN so it doesn't fail validation.
  TestLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TestLambdaFunction
      Action: lambda:GetFunction
      Principal: !Select [4, !Split [":", !Ref IdentityCenterRoleArn]]
      SourceArn: !Ref IdentityCenterRoleArn

Outputs:
  BucketName:
    Value: !Ref TestBucket
  QueueUrl:
    Value: !Ref TestQueue
  TopicArn:
    Value: !Ref TestTopic
  KmsKeyId:
    Value: !Ref TestKmsKey
  SecretArn:
    Value: !Ref TestSecret
  OpenSearchDomainArn:
    Value: !GetAtt TestOpenSearchDomain.Arn
  LambdaFunctionArn:
    Value: !GetAtt TestLambdaFunction.Arn
